name: CI

# 雙語拼音: builds the offline translation DLL on Linux, then Weasel and its
# installer on Windows, and publishes the installer as a release.

on:
  push:
    branches:
      - '*'
    tags:
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4

      - name: Checkout slimt
        run: git submodule update --init --recursive bilingual/mt/slimt

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build zstd

      - name: Build bilingual_mt.dll
        run: bilingual/mt/build.sh

      - name: Download models
        run: bilingual/fetch-models.sh models

      - name: Upload translation files
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-translation
          if-no-files-found: error
          path: |
            bilingual/mt/build/bilingual_mt.dll
            models/

  build:
    needs: translation
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      # bundled winsparkle v0.9.2 to disable auto open ReleaseNoteUrl in default browser
      - name: cache bundled winsparkle
        id: cache-winsparkle
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled
          restore-keys: |
            winsparkle-v0.9.2-bundled

      - name: Build bundled winsparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path winsparkle) { Remove-Item -Recurse -Force winsparkle }
          # Clone winsparkle repo v0.9.2
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          cd winsparkle
          git submodule update --init --recursive
          copy ..\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=Win32 WinSparkle.sln

      - name: Install WinSparkle files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          copy .\winsparkle\x64\Release\WinSparkle.dll .\output\
          copy .\winsparkle\x64\Release\WinSparkle.lib .\lib64\
          copy .\winsparkle\Release\WinSparkle.dll .\output\Win32\
          copy .\winsparkle\Release\WinSparkle.lib .\lib\

      - name: Get Rime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Download translation files
        uses: actions/download-artifact@v4
        with:
          name: bilingual-translation
          path: bilingual-translation

      - name: Add 雙語拼音 files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python bilingual\install-data.py --models bilingual-translation\models --dll bilingual-translation\bilingual\mt\build\bilingual_mt.dll

      - name: Build Weasel
        shell: pwsh
        id: build_weasel
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat arm64 installer
          Copy-Item (Get-ChildItem .\output\archives\weasel-bilingual-*-installer.exe | Select-Object -First 1).FullName .\output\archives\bilingual-pinyin-windows-installer.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weasel-bilingual-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\bilingual-pinyin-windows-installer.exe

      - name: Publish installer
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/bilingual' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bilingual-latest
          target_commitish: ${{ github.sha }}
          name: 雙語拼音 Windows 版（最新）
          prerelease: false
          make_latest: true
          body: |
            雙語拼音輸入法 Windows 版，以小狼毫（Weasel）為基礎。
            下載下面的 bilingual-pinyin-windows-installer.exe，執行後照畫面安裝。
            版本：${{ env.git_ref_name }}
          files: |
            ./output/archives/bilingual-pinyin-windows-installer.exe
