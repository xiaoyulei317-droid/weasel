# Rime schema
# encoding: utf-8
#
# 雙語拼音: pinyin with English translations.
# Needs librime-lua, which Trime (同文) and Weasel (小狼毫) include.

schema:
  schema_id: bilingual_pinyin
  name: 双语拼音
  version: "0.4"
  author:
    - 雙語拼音輸入法 contributors
  description: |
    简体全拼，中文候选旁显示英文，
    第一个候选后面会列出它的英文，可以直接选英文输出。
    整句逐词选好后会先留着，再决定打中文或英文。
    词库来自白霜拼音（GPL-3.0），英文来自 CC-CEDICT（CC BY-SA 4.0）。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: english
    reset: 1
    states: [ 无英文, 中英 ]
  - name: traditionalization
    reset: 0
    states: [ 简体, 繁體 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    # A sentence picked word by word waits to be typed as Chinese or English.
    - lua_processor@*bilingual_sentence
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    # The English table is keyed by simplified words, so attach the English
    # before the optional conversion to traditional characters.
    - lua_filter@*bilingual_english
    - simplifier@traditionalize
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/

translator:
  # bilingual_pinyin.dict.yaml: the word lists of 白霜拼音.
  dictionary: bilingual_pinyin
  prism: bilingual_pinyin
  contextual_suggestions: true
  max_homophones: 7
  max_homographs: 7
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# Language model (lotem/rime-octagram-data, LGPL-3.0) for better sentences.
# The penalty for words it has not seen together suits these word lists.
# Measured on 4,468 sentences against the old Luna Pinyin setup, sentences
# typed right in one go: 59.7% -> 65.5% (everyday), 48.0% -> 58.4% (web).
grammar:
  language: zh-hans-t-essay-bgw
  non_collocation_penalty: -6

traditionalize:
  option_name: traditionalization
  opencc_config: s2tw.json
  tips: none

bilingual_english:
  english_options: 3

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
